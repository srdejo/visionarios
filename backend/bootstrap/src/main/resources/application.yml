spring:
  application:
    name: visionarios-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:visionarios}
    username: ${DB_USER:visionarios}
    password: ${DB_PASSWORD:visionarios}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8089}

security:
  jwt:
    secret: ${JWT_SECRET:visionarios-dev-secret-change-me-please-32-bytes-min}
    ttl-minutes: ${JWT_TTL_MINUTES:720}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:4200}
  # Si esta variable apunta a un usuario ya registrado, se promueve a ADMIN al arrancar
  # (ver AdminBootstrapRunner) — resuelve crear el primer admin sin acceso directo a la BD.
  admin-bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  # Feature flag: mientras esta en false, el registro marca al usuario como verificado
  # de inmediato y el login no exige confirmacion de correo. Apagado por defecto porque
  # el flujo de verificacion se ha vuelto un bloqueante para los usuarios (ver AuthService).
  email-verification-enabled: ${EMAIL_VERIFICATION_ENABLED:false}

contact:
  api:
    base-url: ${CONTACT_API_URL:http://localhost:3000}
  mail:
    # Nombre visible del remitente. La direccion la resuelve contact, que es quien
    # conoce la cuenta que envia; aqui solo se declara quien firma el correo.
    from-name: ${MAIL_FROM_NAME:Red de Visionarios}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [req=%X{requestId:--} usr=%X{userId:--}]"
