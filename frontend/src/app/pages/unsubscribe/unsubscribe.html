<div class="min-h-screen bg-white px-6 py-8 flex flex-col items-center text-center justify-center">
  @if (!done()) {
    <h1 class="font-oswald text-2xl font-bold uppercase">Darme de baja</h1>
    <div class="w-12 h-1 bg-orange mt-2 mb-4"></div>
    <p class="text-muted-2 text-sm max-w-sm">
      Dejarás de recibir correos de invitación a eventos de la Red de Visionarios. Podrás seguir usando tu cuenta
      con normalidad.
    </p>

    @if (error()) {
      <p class="text-danger text-sm mt-4">{{ error() }}</p>
    }

    <button type="button" (click)="confirm()" [disabled]="loading()"
            class="bg-dark text-white font-oswald uppercase tracking-wide py-3 px-8 rounded-lg mt-6 disabled:opacity-50">
      Confirmar baja
    </button>
  } @else {
    <h1 class="font-oswald text-2xl font-bold uppercase">Listo</h1>
    <div class="w-12 h-1 bg-orange mt-2 mb-4"></div>
    <p class="text-muted-2 text-sm max-w-sm">Ya no recibirás correos de invitación a eventos.</p>
    <a routerLink="/login" class="text-orange text-sm mt-6 hover:text-orange-hover">Volver al inicio</a>
  }
</div>
