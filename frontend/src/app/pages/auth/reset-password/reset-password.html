<div class="min-h-screen bg-white flex flex-col lg:flex-row">
  <app-auth-hero></app-auth-hero>

  <div class="flex-1 px-6 py-8 lg:flex lg:items-center lg:justify-center lg:px-14">
    <div class="lg:w-full lg:max-w-[420px]">
      <a routerLink="/login" class="text-muted-1 text-sm">← Volver</a>

      <h1 class="font-oswald text-2xl font-bold uppercase mt-6 lg:text-[34px] lg:leading-tight">Crear nueva contraseña</h1>
      <div class="w-12 h-1 bg-orange mt-2 mb-4 lg:w-[60px] lg:h-1.5"></div>

      <p class="text-muted-2 text-sm mb-6 lg:text-base lg:leading-relaxed">
        Escribe tu nueva contraseña. El enlace vence 60 minutos después de solicitarlo.
      </p>

      <form class="flex flex-col gap-4" (ngSubmit)="submit()">
        <div>
          <label class="font-oswald text-xs tracking-[.14em] uppercase text-muted-1">Contraseña nueva</label>
          <app-password-input class="mt-1 block" name="password" [(ngModel)]="password" [required]="true" [minLength]="8" />
        </div>

        <div>
          <label class="font-oswald text-xs tracking-[.14em] uppercase text-muted-1">Confirmar contraseña</label>
          <app-password-input class="mt-1 block" name="confirmPassword" [(ngModel)]="confirmPassword" [required]="true" [minLength]="8" />
        </div>

        @if (error()) {
          <p class="text-danger text-sm">{{ error() }}</p>
        }

        <button type="submit" [disabled]="loading()"
                class="bg-dark text-white font-oswald uppercase tracking-wide py-3 rounded-lg disabled:opacity-50 lg:h-[54px]">
          Crear nueva contraseña
        </button>
      </form>
    </div>
  </div>
</div>
