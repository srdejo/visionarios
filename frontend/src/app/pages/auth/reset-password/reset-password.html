<div class="min-h-screen bg-white px-6 py-8">
  <a routerLink="/login" class="text-muted-1 text-sm">← Volver</a>

  <h1 class="font-oswald text-2xl font-bold uppercase mt-6">Crear nueva contraseña</h1>
  <div class="w-12 h-1 bg-orange mt-2 mb-4"></div>

  <p class="text-muted-2 text-sm mb-6">Escribe tu nueva contraseña. El enlace vence 60 minutos después de solicitarlo.</p>

  <form class="flex flex-col gap-4" (ngSubmit)="submit()">
    <div>
      <label class="font-oswald text-xs tracking-[.14em] uppercase text-muted-1">Contraseña nueva</label>
      <input type="password" name="password" [(ngModel)]="password" required minlength="8"
             class="mt-1 w-full bg-input border border-line-1 rounded-lg px-3 py-2 focus:bg-white focus:border-dark outline-none" />
    </div>

    @if (error()) {
      <p class="text-danger text-sm">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()"
            class="bg-dark text-white font-oswald uppercase tracking-wide py-3 rounded-lg disabled:opacity-50">
      Crear nueva contraseña
    </button>
  </form>
</div>
