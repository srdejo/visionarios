<div class="relative">
  <input [type]="visible() ? 'text' : 'password'" [ngModel]="value" (ngModelChange)="handleInput($event)"
         [disabled]="disabled()" [required]="required" [attr.minlength]="minLength" [placeholder]="placeholder"
         [attr.autocomplete]="autocomplete" (blur)="onTouched()"
         class="w-full bg-input border border-line-1 rounded-lg pl-3 pr-10 py-2 focus:bg-white focus:border-dark outline-none disabled:opacity-50" />
  <button type="button" (click)="toggleVisible()" [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          class="absolute right-0 top-0 h-full px-3 flex items-center text-muted-1 hover:text-dark">
    <i class="fa-solid" [class.fa-eye]="!visible()" [class.fa-eye-slash]="visible()"></i>
  </button>
</div>
