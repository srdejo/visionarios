server {
    server_name visionarios.micasachurch.co;

    root /home/srdejo/apps/visionarios/frontend;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # style-src permite 'unsafe-inline' porque Angular inyecta los estilos de
    # componentes como <style> en el <head>; ajustar si se migra a nonces/hashes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/visionarios.micasachurch.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/visionarios.micasachurch.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = visionarios.micasachurch.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name visionarios.micasachurch.co;
    return 404; # managed by Certbot


}
